# Словарь линтера стиля «Сальдо».
# pattern — регулярное выражение (без учёта регистра), message — что написать вместо.
# Правила синхронизированы с docs/glossary.md и docs/style/*.md.

terms:
  - pattern: '\bтранзакци\w*'
    message: 'пишите «операция»'
  - pattern: '\bюзер\w*'
    message: 'пишите «пользователь»'
  - pattern: '\b(кликн|кликай|кликат|тапн|тапай|тапат)\w*'
    message: 'пишите «нажмите»'
  - pattern: '\bзалогин\w*'
    message: 'пишите «войдите», «вход»'
  - pattern: '\bнотификаци\w*'
    message: 'пишите «уведомление»'
  - pattern: '\bтрансфер\w*'
    message: 'пишите «перевод»'
  - pattern: '\bпрофит\w*'
    message: 'пишите «доходность» или «прибыль»'
  - pattern: '\bсвайпн\w*'
    message: 'пишите «смахните»'

kanceliarit:
  - pattern: '\bосуществ\w*'
    message: 'замените глаголом действия: «перевести», «настроить»'
  - pattern: '\bпроизв(ести|одится|одит|едите)\b'
    message: 'замените глаголом действия'
  - pattern: '\bв случае,? если\b'
    message: 'пишите «если»'
  - pattern: '\bна данный момент\b'
    message: 'пишите «сейчас»'
  - pattern: '\bданн(ый|ая|ое|ого|ом|ой|ую)\s+(счёт|счет|раздел|метод|документ|экран|пункт)'
    message: 'пишите «этот»'
  - pattern: '\bв рамках\b'
    message: 'пишите «при», «во время», «для»'

yo:
  # Слова, которые в документации «Сальдо» всегда пишутся через «ё».
  - word: 'счет'
    right: 'счёт'
  - word: 'отчет'
    right: 'отчёт'
  - word: 'отчеты'
    right: 'отчёты'
  - word: 'еще'
    right: 'ещё'
  - word: 'расчет'
    right: 'расчёт'
  - word: 'учет'
    right: 'учёт'
  - word: 'учета'
    right: 'учёта'
  - word: 'счете'
    right: 'счёте'
  - word: 'счетом'
    right: 'счётом'
