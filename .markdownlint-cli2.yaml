# Конфигурация markdownlint-cli2 для документации «Сальдо».
# Правила описаны в docs/format/markdown.md. Меняете правило здесь — обновите и страницу.

config:
  default: true

  # Заголовки только через решётку.
  MD003:
    style: atx
  # Маркированные списки только через дефис.
  MD004:
    style: dash
  # Вложенные списки с отступом 4 пробела: иначе Python-Markdown (MkDocs) не видит вложенность.
  MD007:
    indent: 4
  # Абзац пишем одной строкой, длину не ограничиваем.
  MD013: false
  # Одинаковые заголовки допустимы в разных разделах.
  MD024:
    siblings_only: true
  # Нумерация по порядку: 1. 2. 3.
  MD029:
    style: ordered
  # Разрешаем только <kbd>; HTML-комментарии линтер не считает HTML.
  MD033:
    allowed_elements:
      - kbd
  # Блоки кода только огороженные, всегда с языком.
  MD040: true
  MD046:
    style: fenced
  # Таблицы в компактном стиле |---|---| без выравнивания пробелами.
  MD060: false

globs:
  - "docs/**/*.md"
  - "*.md"

ignores:
  - "site/**"
  - "node_modules/**"
